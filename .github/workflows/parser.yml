name: Chinese product collector
run-name: Collector ${{ inputs.mode }} ${{ inputs.setup_id }}
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = availability; preview = no posts; send = live channel'
        type: choice
        options: [probe, preview, send, activate]
        default: probe
      setup_id:
        description: Setup run identifier
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: china-products-publisher
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      ARGOS_DEVICE_TYPE: cpu
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Probe sources
        if: inputs.mode == 'probe'
        run: python scripts/probe.py
      - name: Offline model cache
        if: inputs.mode != 'probe'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-zh-en-ru-linux-v1
      - name: Install offline translation and media support
        if: inputs.mode != 'probe'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python scripts/install_models.py
      - name: Prepare persistent SQLite branch
        if: inputs.mode != 'probe'
        run: |
          git config user.name 'china-products-bot'
          git config user.email 'china-products-bot@users.noreply.github.com'
          bash scripts/state.sh
      - name: Collect and preview
        if: inputs.mode == 'preview'
        run: python parser.py
      - name: Publish to existing channel
        if: inputs.mode == 'send' || inputs.mode == 'activate' || github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python parser.py --send
      - name: Require a real first publication
        if: inputs.mode == 'activate'
        run: python scripts/check_activation.py
      - name: Diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-diagnostics
          path: preview/*.json
          retention-days: 7
          if-no-files-found: ignore
